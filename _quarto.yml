project:
  type: website
  output-dir: _site
  render:
    - index.qmd
    # Monoculture growth (external bioscreen import)
    - scripts/01_bioscreen_strains/01_plot_analyze_growth.qmd
    # Resource use in monoculture. 01 feeds 02, 02 feeds 03.
    - scripts/02_biolog_ecoplates/01_format_growthcurves.qmd
    - scripts/02_biolog_ecoplates/02_growth_curve_stats.qmd
    - scripts/02_biolog_ecoplates/03_plot_analyze_growth.qmd
    # Competition in membrane-separated co-culture plates. 01 -> 02 -> 03.
    - scripts/03_coculture_plates/01_format_growthcurves.qmd
    - scripts/03_coculture_plates/02_growth_curve_stats.qmd
    - scripts/03_coculture_plates/03_competition_outcomes.qmd
    # Serial transfer co-culture. 02 feeds 03; 01 is a standalone pilot.
    - scripts/04_serial_transfer_coculture/01_pilot_20260202.qmd
    - scripts/04_serial_transfer_coculture/02_20260410_format_growthcurves.qmd
    - scripts/04_serial_transfer_coculture/03_20260410_prune_and_plot.qmd
    # Single carbon source growth across streptomycin concentrations. 01 -> 02 -> 03.
    - scripts/05_one_carbon_gcurves/01_carbon_source_platemap_format.qmd
    - scripts/05_one_carbon_gcurves/02_read_format_gcurves.qmd
    - scripts/05_one_carbon_gcurves/03_analyze_gcurves.qmd

website:
  title: "MCTdownUnder"
  navbar:
    search: true
    tools:
      - icon: github
        href: https://github.com/slhogle/MCTdownUnder
    left:
      - sidebar:monoculture
      - sidebar:coculture
      - sidebar:serial_transfer
      - sidebar:one_carbon

  sidebar:
  - id: monoculture
    title: "Monoculture"
    style: "docked"
    background: light
    contents:
    - text: "01.A Growth vs streptomycin"
      href: scripts/01_bioscreen_strains/01_plot_analyze_growth.qmd
    - text: "02.A Ecoplates QC"
      href: scripts/02_biolog_ecoplates/01_format_growthcurves.qmd
    - text: "02.B Ecoplates growth stats"
      href: scripts/02_biolog_ecoplates/02_growth_curve_stats.qmd
    - text: "02.C Ecoplates carbon use"
      href: scripts/02_biolog_ecoplates/03_plot_analyze_growth.qmd
  - id: coculture
    title: "Co-culture plates"
    style: "docked"
    background: light
    contents:
    - text: "03.A Co-culture QC"
      href: scripts/03_coculture_plates/01_format_growthcurves.qmd
    - text: "03.B Co-culture growth stats"
      href: scripts/03_coculture_plates/02_growth_curve_stats.qmd
    - text: "03.C Competition outcomes"
      href: scripts/03_coculture_plates/03_competition_outcomes.qmd
  - id: serial_transfer
    title: "Serial transfer"
    style: "docked"
    background: light
    contents:
    - text: "04.A Pilot 2026-02-02"
      href: scripts/04_serial_transfer_coculture/01_pilot_20260202.qmd
    - text: "04.B Serial transfer QC"
      href: scripts/04_serial_transfer_coculture/02_20260410_format_growthcurves.qmd
    - text: "04.C Serial transfer results"
      href: scripts/04_serial_transfer_coculture/03_20260410_prune_and_plot.qmd
  - id: one_carbon
    title: "Single carbon"
    style: "docked"
    background: light
    contents:
    - text: "05.A Carbon platemap"
      href: scripts/05_one_carbon_gcurves/01_carbon_source_platemap_format.qmd
    - text: "05.B Single carbon QC"
      href: scripts/05_one_carbon_gcurves/02_read_format_gcurves.qmd
    - text: "05.C Single carbon analysis"
      href: scripts/05_one_carbon_gcurves/03_analyze_gcurves.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    toc: true
    # when printing dataframes use rmarkdown::paged_table())
    df-print: paged
    # set default dimensions for figures
    fig-width: 8
    fig-height: 6
    # tidy format R code upon render
    tidy: true
    # include line numbers in code blocks
    code-line-numbers: true
    number-sections: true
    code-fold: show
    code-summary: "Show/hide code"
    code-tools: true

execute:
  freeze: auto        # Default: saving intermediate files to make project rendering faster
  echo: true          # Default: Shows the source code in the output
  eval: true          # Default: Runs the code
  output: false       # Default: Suppress output from running the code
  warning: false      # Default: Suppresses warnings
  message: false      # Default: Suppresses messages

editor: source
